<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>うごくレンズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="ready">
  <div id="top-message"></div>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="chara"><img class="charaimg" src="chara_close.jpg" alt="司会者"></div>
    <div id="intro">なにが みえるかな？</div>
    <div id="countdown">60</div>
    <div id="error"></div>
  </main>

  <div id="answer"></div>

  <footer id="controls">
    <button type="button" class="action" id="btn-intro">説明をきく</button>
    <button type="button" class="action" id="btn-start" disabled>スタート</button>
    <button type="button" class="action" id="btn-stop">ストップ</button>
    <button type="button" class="action" id="btn-reveal">こたえをみる</button>
    <button type="button" class="action" id="btn-retry">次は何でしょう？</button>
  </footer>

  <script src="script.js"></script>
<script>
// 「説明をきく」：説明の声に合わせて、キャラクターの口が動く
(function() {
  const introAudio = new Audio('audio/intro.wav');
  const introButton = document.getElementById('btn-intro');
  const CH = { close: 'chara_close.jpg', half: 'chara_half.jpg', open: 'chara_open.jpg', blink: 'chara_blink.jpg' };
  Object.values(CH).forEach(function(s) { var im = new Image(); im.src = s; });
  const LIP_OPEN = 140, LIP_HALF = 60;   // しきい値（声の大きさ。あとで調整できる）
  let ctx = null, an = null, sourced = false, timer = null, blinkT = null, blinking = false;
  function setChara(k) { document.querySelectorAll('.charaimg').forEach(function(im) { im.src = CH[k]; }); }
  function playing() { return !introAudio.paused && !introAudio.ended; }
  function lipStart() {
    lipStop();
    // 声の解析は、インターネット上（https）だけで使える。パソコン内のファイルを直接開いたときは、簡易の口パク。
    if (!ctx && /^https?:$/.test(location.protocol)) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.3;
        an.connect(ctx.destination);
      } catch (e) { ctx = null; an = null; }
    }
    let useAn = false;
    if (an) {
      try {
        if (!sourced) { ctx.createMediaElementSource(introAudio).connect(an); sourced = true; }
        useAn = true;
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) { useAn = false; }
    }
    const data = useAn ? new Uint8Array(an.frequencyBinCount) : null;
    timer = setInterval(function() {
      if (blinking) return;
      if (!playing()) { setChara('close'); return; }
      if (!useAn) { var r = Math.random(); setChara(r > .66 ? 'open' : (r > .33 ? 'half' : 'close')); return; }
      an.getByteFrequencyData(data);
      var sum = 0; for (var i = 0; i < 30; i++) sum += data[i];
      var avg = sum / 30; window.__lipAvg = avg;
      setChara(avg > LIP_OPEN ? 'open' : (avg > LIP_HALF ? 'half' : 'close'));
    }, 90);
    (function sched() {
      blinkT = setTimeout(function() {
        if (playing()) { blinking = true; setChara('blink'); setTimeout(function() { blinking = false; setChara('close'); }, 150); }
        sched();
      }, 3000 + Math.random() * 2000);
    })();
  }
  function lipStop() { clearInterval(timer); clearTimeout(blinkT); timer = null; blinkT = null; blinking = false; setChara('close'); }

  introAudio.addEventListener('ended', lipStop);
  introAudio.addEventListener('error', lipStop);
  introButton.addEventListener('click', function() {
    if (!introAudio.paused) return;
    introAudio.currentTime = 0;
    lipStart();
    introAudio.play().catch(function(error) {
      console.error('音声を再生できませんでした:', error);
      lipStop();
    });
  });
})();
</script>

<!-- 全画面ボタン（スタッフ用・共通部品 v1） -->
<style>
#btnFullscreen{position:fixed;top:1.2vh;left:1.2vw;top:auto;bottom:1.2vh;z-index:9999;font-family:inherit;font-size:max(13px,2.4vh);line-height:1.2;padding:.7vh 1.3vw;border-radius:1.2vh;border:.3vh solid rgba(60,40,20,.35);background:rgba(255,255,255,.82);color:#4a3a2a;opacity:.8;cursor:pointer;box-shadow:none}
#btnFullscreen:hover,#btnFullscreen:focus-visible{opacity:1}

body.has-started #btn-intro {
  display: none !important;
}
</style>
<button id="btnFullscreen" type="button" aria-label="全画面表示">⛶ 全画面</button>
<script>
(function(){
  var b=document.getElementById('btnFullscreen'), de=document.documentElement;
  var can=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  if(!can){ b.style.display='none'; return; }
  function isFS(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function upd(){ b.textContent=isFS()?'✕ 全画面をやめる':'⛶ 全画面'; }
  b.addEventListener('click',function(e){
    e.stopPropagation();
    try{
      if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else{ (de.requestFullscreen||de.webkitRequestFullscreen).call(de); }
    }catch(err){}
    b.blur();
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
<script>
document.getElementById('btn-start').addEventListener('click', function() {
  document.body.classList.add('has-started');
});
</script>
</body>
</html>
