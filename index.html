<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>うごくレンズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="ready">
  <div id="top-message"></div>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="intro">なにが みえるかな？</div>
    <div id="countdown">60</div>
    <div id="error"></div>
  </main>

  <div id="answer"></div>

  <footer id="controls">
    <button type="button" class="action" id="btn-intro">説明をきく</button>
    <button type="button" class="action" id="btn-start" disabled>スタート</button>
    <button type="button" class="action" id="btn-stop">ストップ</button>
    <button type="button" class="action" id="btn-reveal">こたえをみる</button>
    <button type="button" class="action" id="btn-retry">次は何でしょう？</button>
  </footer>

  <script src="script.js"></script>
<script>
(function() {
  const introAudio = new Audio('audio/intro.wav');
  const introButton = document.getElementById('btn-intro');

  introButton.addEventListener('click', function() {
    if (!introAudio.paused) return;
    introAudio.currentTime = 0;
    introAudio.play().catch(function(error) {
      console.error('音声を再生できませんでした:', error);
    });
  });
})();
</script>

<!-- 全画面ボタン（スタッフ用・共通部品 v1） -->
<style>
#btnFullscreen{position:fixed;top:1.2vh;left:1.2vw;top:auto;bottom:1.2vh;z-index:9999;font-family:inherit;font-size:max(13px,2.4vh);line-height:1.2;padding:.7vh 1.3vw;border-radius:1.2vh;border:.3vh solid rgba(60,40,20,.35);background:rgba(255,255,255,.82);color:#4a3a2a;opacity:.8;cursor:pointer;box-shadow:none}
#btnFullscreen:hover,#btnFullscreen:focus-visible{opacity:1}
</style>
<button id="btnFullscreen" type="button" aria-label="全画面表示">⛶ 全画面</button>
<script>
(function(){
  var b=document.getElementById('btnFullscreen'), de=document.documentElement;
  var can=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  if(!can){ b.style.display='none'; return; }
  function isFS(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function upd(){ b.textContent=isFS()?'✕ 全画面をやめる':'⛶ 全画面'; }
  b.addEventListener('click',function(e){
    e.stopPropagation();
    try{
      if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else{ (de.requestFullscreen||de.webkitRequestFullscreen).call(de); }
    }catch(err){}
    b.blur();
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
</body>
</html>
